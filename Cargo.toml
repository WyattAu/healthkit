[package]
name = "healthkit"
version = "1.2.0"
edition = "2024"
rust-version = "1.85"
description = "Health check endpoints for Rust — liveness, readiness, and startup probes with dependency checking for Kubernetes and Docker"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/healthkit"
keywords = ["health", "kubernetes", "docker", "liveness", "readiness"]
categories = ["web-programming"]
exclude = ["/target"]

[dependencies]
futures = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "signal", "sync", "time"] }
thiserror = "2"

[dependencies.metrics]
version = "0.24"
optional = true

[dependencies.axum]
version = "0.8"
optional = true

[dependencies.redis]
version = "0.32"
default-features = false
optional = true

[dependencies.sqlx]
version = "0.8"
default-features = false
features = ["runtime-tokio", "sqlite"]
optional = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
tower = { version = "0.5", features = ["util"] }

[dev-dependencies.metrics]
version = "0.24"

[features]
default = ["axum"]
axum = ["dep:axum"]
metrics = ["dep:metrics"]
prometheus = []
redis = ["dep:redis"]
sqlx = ["dep:sqlx"]

[[bench]]
name = "health_bench"
harness = false

[[example]]
name = "k8s_service"
required-features = ["axum", "sqlx", "redis", "prometheus"]

[[test]]
name = "prometheus_metrics"
required-features = ["prometheus", "axum"]

[[test]]
name = "metrics_facade"
required-features = ["metrics"]

[[test]]
name = "redis_check"
required-features = ["redis"]

[[test]]
name = "sqlx_check"
required-features = ["sqlx"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
indexing_slicing = "deny"
panic = "deny"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
