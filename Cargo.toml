[package]
name = "healthkit"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Health check endpoints for Rust — liveness, readiness, and startup probes with dependency checking for Kubernetes and Docker"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/healthkit"
keywords = ["health", "kubernetes", "docker", "liveness", "readiness"]
categories = ["web-programming"]
exclude = ["/target"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "signal"] }
thiserror = "2"

[dependencies.axum]
version = "0.8"
optional = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
tower = { version = "0.5", features = ["util"] }


[features]
default = ["axum"]
axum = ["dep:axum"]

[[bench]]
name = "health_bench"
harness = false

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
indexing_slicing = "deny"
panic = "deny"
