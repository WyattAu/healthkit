# healthkit: mutation testing with cargo-mutants.
#
# Policy: engineering-standards/MUTATION.md.
# Baseline (local, 2026-09-06): 19 mutants — 15 caught, 4 unviable, 0 survived (100% of viable).
#
# Promote when stable: once survivors are equivalent-only (or zero) and
# the score is stable across 4 consecutive weekly runs, set
# continue-on-error: false and add a score gate
# (cargo mutants --all-features --fail-under <score>).
name: mutation

on:
  schedule:
    - cron: "0 3 * * 1" # weekly — Monday 03:00 UTC
  workflow_dispatch: {}

jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Informational until the baseline is triaged — see "promote when stable".
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Run mutation tests
        run: cargo mutants --all-features --no-shuffle
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-out
          path: mutants.out/
          if-no-files-found: warn
